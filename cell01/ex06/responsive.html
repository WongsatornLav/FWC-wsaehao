<!DOCTYPE html>
<html>

<head>
    <title>Responsive</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
            text-align: center;
            font-size: 20px;
        }

        .left {
            background-color: lightblue;
        }

        .right {
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="left">Hello</td>
            <td class="right">World</td>
        </tr>
    </table>

</body>

</html>
