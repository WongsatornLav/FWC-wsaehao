<!DOCTYPE html>

<head>
    <title>It's over 9000</title>
    <link rel="stylesheet" href="calc.css">
</head>

<body>
    <form id="calcForm">
        <input type="text" id="leftMember" placeholder="Left member">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="text" id="rightMember" placeholder="Right member">

        <input type="submit" value="Try me!">
    </form>

    <script src="calc.js"></script>
</body>

</html>
